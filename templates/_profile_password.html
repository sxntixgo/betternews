<form hx-post="/profile/password" hx-target="#password-panel" hx-swap="innerHTML" class="models-form">
  {% if not must_change %}
    <div class="models-row">
      <label for="current_password">Current</label>
      <input type="password" name="current_password" id="current_password"
             autocomplete="current-password">
    </div>
  {% endif %}
  <div class="models-row">
    <label for="new_password">New</label>
    <input type="password" name="new_password" id="new_password" autocomplete="new-password">
  </div>
  <div class="models-row">
    <label for="confirm_password">Repeat</label>
    <input type="password" name="confirm_password" id="confirm_password" autocomplete="new-password">
  </div>
  {% if error %}<p class="ollama-result ollama-result-bad">{{ error }}</p>{% endif %}
  {% if saved %}<p class="ollama-result ollama-result-ok">Password changed.</p>{% endif %}
  <div class="models-actions"><button type="submit">Change password</button></div>
</form>
