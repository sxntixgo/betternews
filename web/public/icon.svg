<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Better News. Full-bleed so it works as a maskable icon: the mark sits
       inside the central 80% that every launcher mask is guaranteed to keep. -->
  <rect width="512" height="512" fill="#1f1d1a"/>
  <text x="256" y="256" fill="#faf9f6" font-family="'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="280" font-weight="700" text-anchor="middle" dominant-baseline="central">B</text>
</svg>
